<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Movie DB</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <header class="header">
        <h1>MovieDB Apps</h1>
        <nav>
            <a href="#">Homepage</a>
            <a href="#">Favorite</a>
            <a href="#">Popular</a>
        </nav>
    </header>

    <main>
        <div class="loading-page">
           <div class="spinner"></div>
        </div>
        <section id="hero-section">
            <div class="poster-detail">
                <img src="" alt="">
            </div>

            <div class="movie-detail">
                <h1>&nbsp;</h1>
                <span class="movie-detail-release-date">&nbsp;</span>
                <span class="movie-detail-genres">&nbsp;</span>


                <p class="movie-detail-overview">
                    &nbsp;
                </p>


                <button type="button" class="btn-trailer">Play Trailer</button>
            </div>
        </section>

        <div class="modal-trailer">
            <div class="modal-trailer-content">
                <div class="modal-trailer-content-header">
                    <h2>Trailer</h2>
                    <a href="#" class="close-modal">&times;</a>
                </div>

                <iframe width="100%" height="315" src="https://www.youtube.com/embed/PWQPJvVllS4?si=uLQyaBvJbsGehiry" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </div>
    </main>

    <footer>
        <!-- Copyright by Enrico -->
    </footer>

    <script type="module" src="./scripts/detail-script.js"></script>
</body>
</html>
